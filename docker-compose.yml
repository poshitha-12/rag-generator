services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  rag-generator:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./chroma_store:/app/chroma_store
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  rag-worker:
    build: .
    command: rq worker --url redis://redis:6379
    volumes:
      - ./data:/app/data
      - ./chroma_store:/app/chroma_store
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
